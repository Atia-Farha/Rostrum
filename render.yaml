services:
  - type: web
    name: rostrum
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: Rostrum
      # ⚠️  Set APP_URL and ASSET_URL in the Render dashboard BEFORE the first deploy.
      # Use the full public HTTPS URL Render assigns (e.g. https://rostrum.onrender.com).
      # If left blank, the entrypoint automatically falls back to $RENDER_EXTERNAL_URL.
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
        # SQLite file must live inside the persistent disk mount (/var/www/html/storage)
        # so it survives container restarts and redeploys. The entrypoint creates the
        # directory and file on first boot.
      - key: DB_DATABASE
        value: /var/www/html/storage/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
    disk:
      name: rostrum-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
